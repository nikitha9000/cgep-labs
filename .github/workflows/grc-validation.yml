name: GRC Security Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-validation:
    name: Terraform Format and Validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.9.8

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform/

      - name: Initialize Terraform
        working-directory: terraform/primitives/compliant-s3
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: terraform/primitives/compliant-s3
        run: terraform validate

  opa-validation:
    name: OPA Policy Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1
        with:
          version: 1.22.3

      - name: Check OPA policy syntax
        run: opa check policies/terraform/

      - name: Run OPA policy tests
        run: opa test policies/terraform/ -v

  checkov-security-scan:
    name: Checkov Infrastructure Security Scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install and run Checkov
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install checkov==3.4.4
          checkov --directory terraform/primitives/compliant-s3 --framework terraform --quiet

  control-mapping-validation:
    name: Control Mapping Validation
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate control-to-code mapping
        shell: pwsh
        run: .\scripts\validate-control-mapping.ps1

  evidence-generation:
    name: Generate and Archive GRC Evidence
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.9.8

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1
        with:
          version: 1.22.3

      - name: Initialize Terraform
        working-directory: terraform/primitives/compliant-s3
        run: terraform init -backend=false

      - name: Generate validation evidence
        shell: pwsh
        run: .\scripts\generate-evidence.ps1

      - name: Verify evidence checks
        shell: pwsh
        run: |
          $report = Get-Content .\evidence\generated\local-validation-evidence.json -Raw | ConvertFrom-Json

          Write-Host "Evidence summary:"
          Write-Host "Passed: $($report.summary.passed)"
          Write-Host "Failed: $($report.summary.failed)"
          Write-Host "Not run: $($report.summary.not_run)"

          if ($report.summary.failed -gt 0 -or $report.summary.not_run -gt 0) {
              throw "Evidence validation contains failed or unrun checks."
          }

          Write-Host "Evidence validation passed."

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: grc-validation-evidence
          path: evidence/generated/local-validation-evidence.json
          if-no-files-found: error
          retention-days: 30
